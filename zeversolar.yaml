esphome:
  name: "solar-gateway"
  friendly_name: "Zeversolar Inverter"
  platformio_options:
    board_build.flash_mode: dio
    build_flags:
      - -DARDUINO_USB_MODE=1
      - -DARDUINO_USB_CDC_ON_BOOT=1

esp32:
  board: lolin_s3_mini
  variant: esp32s3
  framework:
    type: arduino

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  # ESPHome removed API passwords in 2026.1.0: encrypt the native API with a key instead
  # (generate one with `openssl rand -base64 32` and put it in your secrets.yaml as api_encryption_key).
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  fast_connect: true
  ap:
    ssid: "Solar-Gateway-Fallback"
    password: "solar-recovery"

uart:
  - id: inverter_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 9600
    stop_bits: 1

modbus:
  id: modbus1
  uart_id: inverter_uart

modbus_controller:
  - id: zeversolar
    address: 1
    modbus_id: modbus1
    command_throttle: 100ms
    update_interval: 10s

sensor:
  # --- Live Data ---
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Current Power"
    address: 0x100A
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Daily Yield"
    address: 0x100C
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "kWh"
    filters:
      - multiply: 0.1
    device_class: energy

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Total Yield"
    address: 0x101D
    register_type: read
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    filters:
      - multiply: 0.1
    device_class: energy

  # --- Diagnostics ---
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Inverter Temp"
    address: 0x1002
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "°C"
    filters:
      - multiply: 0.1
    device_class: temperature

  # --- DC String Data ---
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar PV1 Voltage"
    address: 0x1004
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    filters: { multiply: 0.1 }

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar PV1 Current"
    address: 0x1005
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    filters: { multiply: 0.1 }

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar PV2 Voltage"
    address: 0x1006
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    filters: { multiply: 0.1 }

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar PV2 Current"
    address: 0x1007
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    filters: { multiply: 0.1 }

  # --- AC Grid Data ---
  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Grid Voltage"
    address: 0x1009
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    filters: { multiply: 0.1 }

  - platform: modbus_controller
    modbus_controller_id: zeversolar
    name: "Solar Grid Frequency"
    address: 0x1013
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "Hz"
    filters: { multiply: 0.01 }

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Solar Gateway IP"
